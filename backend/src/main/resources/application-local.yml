spring:
  datasource:
    url: jdbc:h2:mem:helperhaven;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    properties:
      hibernate:
        format_sql: true

server:
  error:
    include-message: always

logging:
  level:
    com.helperhaven: DEBUG
    org.hibernate.SQL: DEBUG
