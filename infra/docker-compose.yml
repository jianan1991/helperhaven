name: helperhaven

services:
  # ---------- Data layer ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-helperhaven}
      POSTGRES_USER: ${DB_USER:-helperhaven}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helperhaven}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-helperhaven} -d ${DB_NAME:-helperhaven}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Dev cloud emulation ----------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the default bucket after minio is up
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin};
      mc mb -p local/${STORAGE_BUCKET:-helperhaven-dev} || true;
      mc anonymous set download local/${STORAGE_BUCKET:-helperhaven-dev}/public || true;
      "

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"    # SMTP
      - "8025:8025"    # Web UI

  # ---------- App services ----------
  backend:
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-helperhaven}
      DB_PASSWORD: ${DB_PASSWORD:-helperhaven}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MINIO_HOST: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-helperhaven-dev}
      STORAGE_REGION: ap-southeast-1
      STORAGE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-please-change-in-prod-dev-jwt-secret-please-change}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_stub}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_stub}
    ports:
      - "8080:8080"

  frontend-web:
    build:
      context: ../frontend-web
    depends_on:
      - backend
    ports:
      - "5173:80"

  admin:
    build:
      context: ../admin
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
