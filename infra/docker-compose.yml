
name: helperhaven

services:
  # ---------- Data layer ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-helperhaven}
      POSTGRES_USER: ${DB_USER:-helperhaven}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helperhaven}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-helperhaven} -d ${DB_NAME:-helperhaven}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"    # SMTP
      - "8025:8025"    # Web UI

  # ---------- App services ----------
  backend:
    build:
      context: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-helperhaven}
      DB_PASSWORD: ${DB_PASSWORD:-helperhaven}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-please-change-in-prod-dev-jwt-secret-please-change}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_stub}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_stub}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/tmp/helperhaven-uploads

  frontend-web:
    build:
      context: ../frontend-web
    depends_on:
      - backend
    ports:
      - "5173:80"

  admin:
    build:
      context: ../admin
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  postgres_data:
  uploads_data:
